<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#091127"><title>TarnStarGame · Shooting Wishes</title>
<link rel="icon" href="assets/images/stars/gold-star.png"><link rel="stylesheet" href="css/game.css">
</head>
<body>
<main id="game" aria-label="抓住星星 · Shooting Wishes">
<video id="background" playsinline preload="auto" aria-hidden="true"></video>
<div id="veil"></div>
<div id="playfield" aria-label="Catch the white and gold stars, avoid the red ones"></div>
<div id="timer" hidden role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="60"><div id="time-fill"></div></div>
<button id="sound" aria-label="Mute sound" hidden>♪</button>
<section id="start-screen" class="screen"><div class="start-content"><div id="hbd-logo" data-art="hbd-tarn" role="img" aria-label="Happy Birthday Tarn"></div><div data-art="rules-frame"></div><button id="start" class="image-button" aria-label="Start Game" disabled></button><p id="loading" role="status">Loading stars…</p></div></section>
<div id="countdown" hidden aria-live="polite"></div>
<div id="announcement" hidden></div>
<div id="hud" hidden><div id="wishes"><div data-art="wishes-counter-frame"></div><output id="score">0</output><div id="combo" data-art="combo-x2" hidden></div></div><div id="best"><div data-art="best-score-frame"></div><output id="best-value">0</output><span id="best-name" class="best-name" hidden></span></div></div>
<section id="end-screen" class="screen" hidden aria-label="Results"><div class="end-content"><div id="result"><div data-art="result-frame"></div><output id="final-score">0</output><div id="record" data-art="new-best-score" hidden></div></div><div id="end-best"><div data-art="best-score-frame-end"></div><output id="end-best-value">0</output></div><section id="top-five" aria-label="Top 5"><div data-art="top5-score"></div><ol id="top-five-list"></ol></section><form id="record-form" hidden><label for="nickname">Enter your nickname</label><div><input id="nickname" name="nickname" maxlength="12" required autocomplete="nickname" aria-label="Enter your nickname"><button id="save-score" type="submit">Save score</button></div></form><div class="end-buttons"><button id="replay" class="image-button" aria-label="Replay"></button></div></div></section>
<div id="leaderboard-notice"><span id="leaderboard-status" role="status"></span><button id="retry-leaderboard" type="button">Retry leaderboard</button></div><button id="resume" hidden>Tap to resume ♪</button>
</main><script type="module" src="js/game.js"></script>
<script type="module">if(new URLSearchParams(location.search).has("test")) import("./tests/browser-check.js");</script></body></html>
